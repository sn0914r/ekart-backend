services:
  ekart-backend:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - ekart-mongodb
      - ekart-redis
    networks:
      - ekart-network

networks:
  ekart-network:
