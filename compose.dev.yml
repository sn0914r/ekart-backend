services:
  ekart-backend:
    container_name: ekart-backend
    build: 
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      ekart-mongodb:
        condition: service_started
      ekart-redis:
        condition: service_started
    networks:
      - ekart-network
    
  ekart-redis:
    image: redis:7
    container_name: ekart-redis
    ports:
      - "6379:6379"
    volumes:
      - ekart-redis-volume:/data
    networks:
      - ekart-network
  
  ekart-mongodb:
    image: mongo:8
    container_name: ekart-mongodb
    ports: 
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=sivananda
      - MONGO_INITDB_ROOT_PASSWORD=sivananda123
    volumes:
      - ekart-mongo-volume:/data/db
    networks:
      - ekart-network

volumes:
  ekart-redis-volume:
  ekart-mongo-volume:

networks:
  ekart-network:
