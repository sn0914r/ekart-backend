paths:
  # ==========================================
  # Dashboard
  # ==========================================
  /admin/dashboard:
    get:
      tags:
        - Insights (Admin)
      summary: Get dashboard data
      description: Get overview dashboard data including stats, recent orders, low stock items, and recent activity. Requires admin role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Dashboard data fetched successfully
                  data:
                    $ref: "#/components/schemas/DashboardData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # Analytics
  # ==========================================
  /admin/analytics:
    get:
      tags:
        - Insights (Admin)
      summary: Get analytics data
      description: Get detailed analytics including monthly revenue trends, order status distribution, top products, and key metrics. Requires admin role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Analytics data fetched successfully
                  data:
                    $ref: "#/components/schemas/AnalyticsData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ==========================================
# Components & Schemas
# ==========================================
components:
  schemas:
    DashboardData:
      type: object
      properties:
        stats:
          type: object
          properties:
            totalRevenue:
              type: number
              example: 1250000
            totalOrders:
              type: integer
              example: 320
            pendingOrders:
              type: integer
              example: 12
            lowStockCount:
              type: integer
              example: 5
        recentOrders:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 665a1b2c3d4e5f6a7b8c9d0e
              email:
                type: string
                example: tigor123@gmail.com
              subTotal:
                type: number
                example: 79999
              orderStatus:
                type: string
                example: CREATED
              paymentStatus:
                type: string
                example: PAID
              createdAt:
                type: string
                format: date-time
        lowStockItems:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 665a1b2c3d4e5f6a7b8c9d0e
              name:
                type: string
                example: iPhone 16
              stock:
                type: integer
                example: 3
              category:
                type: string
                example: Smartphones
              images:
                type: array
                items:
                  type: string
        recentActivity:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 665a1b2c3d4e5f6a7b8c9d0e
              orderStatus:
                type: string
                example: CONFIRMED
              paymentStatus:
                type: string
                example: PAID
              createdAt:
                type: string
                format: date-time
              subTotal:
                type: number
                example: 159998

    AnalyticsData:
      type: object
      properties:
        monthlyRevenue:
          type: array
          items:
            type: object
            properties:
              _id:
                type: object
                properties:
                  month:
                    type: integer
                    example: 6
                  year:
                    type: integer
                    example: 2026
              revenue:
                type: number
                example: 450000
              count:
                type: integer
                example: 85
        orderStatusDistribution:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: CONFIRMED
              count:
                type: integer
                example: 120
        topProducts:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: 665a1b2c3d4e5f6a7b8c9d0e
              revenue:
                type: number
                example: 399995
              totalSold:
                type: integer
                example: 5
              productName:
                type: string
                example: iPhone 16
              image:
                type: string
                example: https://res.cloudinary.com/demo/image/upload/iphone16.jpg
        metrics:
          type: object
          properties:
            totalRevenue:
              type: number
              example: 1250000
            totalPaidOrders:
              type: integer
              example: 200
            averageOrderValue:
              type: number
              example: 6250
