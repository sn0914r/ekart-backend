paths:
  # ==========================================
  # Customer Profile
  # ==========================================
  /users/me:
    get:
      tags:
        - Users (User)
      summary: Get authenticated user profile
      description: Returns the logged-in user's profile, summary statistics, and recent orders.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User profile fetched successfully
                  data:
                    $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users (User)
      summary: Update authenticated user profile
      description: Update name or phone number of the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                phone:
                  type: string
                  example: "+919876543210"
      responses:
        "200":
          description: User profile updated successfully
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized

  # ==========================================
  # Admin Users Management
  # ==========================================
  /admin/users:
    get:
      tags:
        - Users (Admin)
      summary: List users (Admin)
      description: Get paginated list of users with search, role, status filtering, and sorting.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of users per page (max 50)
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          description: Search by name, email, or phone
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role (user, admin, demo-admin)
          required: false
          schema:
            type: string
            enum: [user, admin, demo-admin]
        - name: isActive
          in: query
          description: Filter by active status (true or false)
          required: false
          schema:
            type: string
            enum: ["true", "false"]
        - name: sort
          in: query
          description: Sorting field, e.g. -createdAt, name, email
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Users fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Users fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUserItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin role required

  /admin/users/{id}:
    get:
      tags:
        - Users (Admin)
      summary: Get user 360 overview (Admin)
      description: Get detailed user profile along with order statistics, total spent, and recent orders.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User MongoDB ObjectId
          required: true
          schema:
            type: string
            example: 64f1b2c3d4e5f6a7b8c9d0e1
      responses:
        "200":
          description: User fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User fetched successfully
                  data:
                    $ref: "#/components/schemas/AdminUserDetailResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users (Admin)
      summary: Update user status or role (Admin)
      description: Update user role (promotion/demotion) or account status (activate/deactivate).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, admin, demo-admin]
                isActive:
                  type: boolean
                  example: false
      responses:
        "200":
          description: User updated successfully
        "400":
          description: Bad request (e.g. self-demotion or self-deactivation)
        "403":
          description: Forbidden (Edits disabled for demo-admin)
        "404":
          description: User not found

components:
  schemas:
    AdminUserItem:
      type: object
      properties:
        _id:
          type: string
          example: 64f1b2c3d4e5f6a7b8c9d0e1
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        role:
          type: string
          example: user
        phone:
          type: string
          nullable: true
          example: "+919876543210"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminUserDetailResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUserItem"
        stats:
          type: object
          properties:
            totalOrders:
              type: integer
              example: 12
            totalSpent:
              type: number
              example: 45000
            cartItemsCount:
              type: integer
              example: 2
            wishlistItemsCount:
              type: integer
              example: 5
        recentOrders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              orderId:
                type: string
                example: EK-A1B2C3
              subTotal:
                type: number
                example: 1299
              orderStatus:
                type: string
                example: CONFIRMED
              paymentStatus:
                type: string
                example: PAID
              shippingStatus:
                type: string
                example: SHIPPED
              itemsCount:
                type: integer
                example: 2
              createdAt:
                type: string
                format: date-time

    UserProfileResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
        stats:
          type: object
          properties:
            totalOrders:
              type: integer
            cartItemsCount:
              type: integer
            wishlistItemsCount:
              type: integer
        recentOrders:
          type: array
          items:
            type: object

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        totalUsers:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
