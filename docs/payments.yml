paths:
  # ==========================================
  # Initiate Payment Order
  # ==========================================
  /payments/initiate:
    post:
      tags:
        - Payment (User)
      summary: Initiate payment order
      description: Initiate a payment session through the Payment Orchestration Engine (POE). Applies rate limiting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentRequest"
      responses:
        "200":
          description: Payment order initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Payment order created successfully
                  data:
                    type: object
                    description: Payment session details returned from POE
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - User role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # Verify Payment Webhook (POE)
  # ==========================================
  /payments/webhook/verify:
    post:
      tags:
        - Payment (User)
      summary: Verify payment webhook
      description: Internal webhook endpoint called by the Payment Orchestration Engine (POE) with an HMAC signature. Confirms the order, deducts inventory, and enqueues confirmation tasks.
      parameters:
        - in: header
          name: x-poe-signature
          required: false
          schema:
            type: string
          description: Cryptographic HMAC signature from POE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  example: 665a1b2c3d4e5f6a7b8c9d0e
                paymentId:
                  type: string
                  example: pay_ABC123XYZ
                status:
                  type: string
                  example: SUCCESS
      responses:
        "200":
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook processed
        "400":
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ==========================================
# Components & Schemas
# ==========================================
components:
  schemas:
    InitiatePaymentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          example: 665a1b2c3d4e5f6a7b8c9d0e
        method:
          type: string
          example: UPI
