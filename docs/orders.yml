paths:
  # ==========================================
  # Get User's Orders
  # ==========================================
  /orders:
    get:
      tags:
        - Orders (User)
      summary: Get all orders
      description: Fetch all orders for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Orders fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - User role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    # ==========================================
    # Create Order
    # ==========================================
    post:
      tags:
        - Orders (User)
      summary: Create a new order
      description: Create an order from the user's cart. Cart must not be empty. Clears the cart after order creation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order created successfully
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        example: 665a1b2c3d4e5f6a7b8c9d0e
                      subTotal:
                        type: number
                        example: 159998
        "400":
          description: Validation failed or cart is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - User role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # Get Single Order
  # ==========================================
  /orders/{id}:
    get:
      tags:
        - Orders (User)
      summary: Get order by ID
      description: Get detailed order information including timeline. User can only access their own orders.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: Order fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order fetched successfully
                  data:
                    $ref: "#/components/schemas/OrderDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Not your order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    # ==========================================
    # Cancel Order (User)
    # ==========================================
    patch:
      tags:
        - Orders (User)
      summary: Cancel order
      description: Cancel an order. Only orders with status CREATED or CONFIRMED and shipping PENDING can be cancelled. Stock is reverted.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderStatus:
                  type: string
                  enum: [CANCELLED]
                  example: CANCELLED
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order updated successfully
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found or cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # Get All Orders (Admin)
  # ==========================================
  /admin/orders:
    get:
      tags:
        - Orders (Admin)
      summary: Get all orders
      description: Fetch a paginated list of all orders with optional filtering and sorting. Requires admin role.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Number of items per page
        - in: query
          name: sort
          schema:
            type: string
          description: "Sort fields (comma separated). Prefix with - for descending. e.g. -createdAt,subTotal"
      responses:
        "200":
          description: Orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Orders fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==========================================
  # Get / Update Single Order (Admin)
  # ==========================================
  /admin/orders/{id}:
    get:
      tags:
        - Orders (Admin)
      summary: Get order by ID
      description: Get detailed order information. Requires admin role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: Order fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order fetched successfully
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Orders (Admin)
      summary: Update shipping status
      description: "Update the shipping status of an order. Valid transitions: PENDING → PACKED → SHIPPED → DELIVERED. Sends email notification to the customer. Requires admin role."
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingStatus:
                  type: string
                  enum: [PENDING, PACKED, SHIPPED, DELIVERED, CANCELLED]
                  example: SHIPPED
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order updated successfully
                  data:
                    type: object
                    properties:
                      shippingStatus:
                        type: string
                        example: SHIPPED
        "400":
          description: Validation failed or invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ==========================================
# Components & Schemas
# ==========================================
components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - shippingAddress
      properties:
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"

    ShippingAddress:
      type: object
      required:
        - name
        - address
        - phone
        - city
        - state
        - pincode
      properties:
        name:
          type: string
          example: Tigor
        address:
          type: string
          minLength: 25
          example: 123, MG Road, Near City Mall, Bangalore
        phone:
          type: string
          pattern: '^\+91\d{10}$'
          example: "+919876543210"
        city:
          type: string
          example: Bangalore
        state:
          type: string
          example: Karnataka
        country:
          type: string
          example: India
        pincode:
          type: string
          example: "560001"

    Order:
      type: object
      properties:
        _id:
          type: string
          example: 665a1b2c3d4e5f6a7b8c9d0e
        orderId:
          type: string
          example: EK-8C9D0E
        userId:
          type: string
        email:
          type: string
          example: tigor123@gmail.com
        currency:
          type: string
          example: INR
        subTotal:
          type: number
          example: 159998
        orderStatus:
          type: string
          enum: [CREATED, CONFIRMED, CANCELLED]
          example: CREATED
        paymentStatus:
          type: string
          enum: [PENDING, PAID]
          example: PENDING
        shippingStatus:
          type: string
          enum: [PENDING, PACKED, SHIPPED, DELIVERED, CANCELLED]
          example: PENDING
        orderSnapshot:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        createdAt:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            timeline:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                    example: Order placed
                  status:
                    type: string
                    example: CREATED
                  at:
                    type: string
                    format: date-time
            paymentDetails:
              type: object
              properties:
                razorpayPaymentId:
                  type: string
                  example: pay_ABC123XYZ

    OrderItem:
      type: object
      properties:
        productId:
          type: string
          example: 665a1b2c3d4e5f6a7b8c9d0e
        name:
          type: string
          example: iPhone 16
        price:
          type: number
          example: 79999
        quantity:
          type: integer
          example: 2
        lineTotal:
          type: number
          example: 159998
